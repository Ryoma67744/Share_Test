    let view = 'new';
    const body = () => card.querySelector('[data-reconcile-body]');
    const num = (v) => { if (v == null || v === '') return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
    const fmt = (v) => (v == null || v === '') ? '—' : safe(String(v));

    async function reload() {
        body().innerHTML = '<div class="muted" style="padding:12px;">読み込み中…</div>';
        try {
            const rows = await SupabaseClient.listMeasuredCompounds(_readCachedMasterPw());
            allRows = Array.isArray(rows) ? rows : [];
        } catch (e) {
            body().innerHTML = '<div class="err" style="padding:12px;">取得に失敗しました: ' + safe(String((e && (e.message || e.details)) || e)) + '</div>';
            return;
        }
        render();
    }
    function counts() {
        let n = 0, ig = 0, rg = 0;
        for (const r of allRows) { if (r.status === 'new') n++; else if (r.status === 'ignored') ig++; else rg++; }
        return { n, ig, rg };
    }
    function render() {
        const c = counts();
        const rows = allRows.filter(r => r.status === view);
        let inner = ''
            + '<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;">'
            +   '<button type="button" class="btn mini' + (view === 'new' ? ' primary' : '') + '" data-view="new">未処理 (' + c.n + ')</button>'
            +   '<button type="button" class="btn mini' + (view === 'ignored' ? ' primary' : '') + '" data-view="ignored">無視済み (' + c.ig + ')</button>'
            +   '<span class="muted" style="font-size:11px;">登録済み ' + c.rg + '</span>'
            + '</div>';
        if (!rows.length) {
            inner += '<div class="muted" style="padding:12px;">' + (view === 'new' ? '未登録の実測化合物はありません。' : '無視済みの化合物はありません。') + '</div>';
            body().innerHTML = inner;
            return;
        }
        if (view === 'new') {
            const trows = rows.map((r, i) =>
                '<tr>'
                + '<td><input type="checkbox" class="rc-sel" data-i="' + i + '"></td>'
                + '<td class="l">' + safe(r.name) + '</td>'
                + '<td>' + fmt(r.precursor) + '</td>'
                + '<td>' + fmt(r.product) + '</td>'
                + '<td>' + fmt(r.ce) + '</td>'
                + '<td>' + fmt(r.cv) + '</td>'
                + '<td>' + fmt(r.polarity) + '</td>'
                + '<td>' + safe(String(r.n_projects)) + '</td>'
                + '<td><button type="button" class="btn mini" data-rc-preview data-i="' + i + '" title="測定像をビューアでプレビュー (背景に重ね／強度レンジ／透明度)">🔬 表示</button></td>'
                + '</tr>'
            ).join('');
            inner += '<div style="max-height:44vh;overflow:auto;border:1px solid #e5e7eb;border-radius:6px;">'
                + '<table class="tr-table" style="width:100%;">'
                + '<thead><tr><th><input type="checkbox" data-rc-all title="全選択"></th><th class="l">化合物名</th><th>Precursor</th><th>Fragment</th><th>CE</th><th>CV</th><th>極性</th><th>PJ数</th><th>測定像</th></tr></thead>'
                + '<tbody>' + trows + '</tbody></table></div>';
            inner += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">'
                + '<label style="font-size:11px;color:#475569;">タグ (任意・一括適用)<br><input type="text" data-rc-tags placeholder="例: アミノ酸" style="padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px;"></label>'
                + '<label style="font-size:11px;color:#475569;">確認レベル<br><select data-rc-level style="padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px;background:#fff;"><option value="unchecked">未確認</option><option value="std">標準品確認済み</option><option value="lit">文献のみ</option></select></label>'
                // Defaults to the archive: everything listed here was measured
                // but never optimised, which is exactly what that shelf holds.
                + '<label style="font-size:11px;color:#475569;">登録先<br><select data-rc-shelf style="padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px;background:#fff;"><option value="archive">使用実績アーカイブ</option><option value="main">検証済みライブラリ</option></select></label>'
                + '<span style="flex:1"></span>'
                + '<button type="button" class="btn" data-rc-ignore>選択を無視</button>'
                + '<button type="button" class="btn primary" data-rc-register>選択を登録</button>'
                + '</div>';
        } else {
            const trows = rows.map((r, i) =>
                '<tr><td><input type="checkbox" class="rc-sel" data-i="' + i + '"></td><td class="l">' + safe(r.name) + '</td><td>' + safe(String(r.n_projects)) + '</td></tr>'
            ).join('');
            inner += '<div style="max-height:48vh;overflow:auto;border:1px solid #e5e7eb;border-radius:6px;">'
                + '<table class="tr-table" style="width:100%;">'
                + '<thead><tr><th><input type="checkbox" data-rc-all title="全選択"></th><th class="l">化合物名</th><th>PJ数</th></tr></thead>'
                + '<tbody>' + trows + '</tbody></table></div>';
            inner += '<div style="display:flex;justify-content:flex-end;margin-top:10px;"><button type="button" class="btn" data-rc-unignore>選択を無視解除</button></div>';
        }
        body().innerHTML = inner;
    }
    function selectedRows() {
        const rows = allRows.filter(r => r.status === view);
        const out = [];
        body().querySelectorAll('.rc-sel:checked').forEach(cb => {
            const i = parseInt(cb.getAttribute('data-i'), 10);
            if (rows[i]) out.push(rows[i]);
        });
        return out;
    }
    async function doRegister() {
        const sel = selectedRows();
        if (!sel.length) { alert('登録する行を選択してください'); return; }
        const tagsEl = body().querySelector('[data-rc-tags]');
        const lvEl = body().querySelector('[data-rc-level]');
        const shEl = body().querySelector('[data-rc-shelf]');
        const tags = parseTags(tagsEl ? tagsEl.value : '');
        const level = (lvEl && lvEl.value) || 'unchecked';
        const shelf = (shEl && shEl.value) || 'archive';
        const pw = _readCachedMasterPw();
        openModal('<h2>登録中…</h2><p data-prog style="font-size:12px;color:#475569;">0 / ' + sel.length + '</p>');
        const pcard = openModal._card;
        let ok = 0, fail = 0;
        for (let i = 0; i < sel.length; i++) {
            const r = sel[i];
            try {
                await SupabaseClient.registerMeasuredCompound(pw, {
                    name: r.name, tags, polarity: r.polarity || null,
                    precursor: num(r.precursor), product: num(r.product), ce: num(r.ce), cv: num(r.cv),
                    check_level: level, shelf,
                });
                ok++;
            } catch (e) { console.warn('register measured failed', r.name, e); fail++; }
            const pe = pcard.querySelector('[data-prog]'); if (pe) pe.textContent = (i + 1) + ' / ' + sel.length;
        }
        if (pcard._close) pcard._close(true);
        await loadLibrary();
        await reload();
        alert(SHELVES[shelf].label + 'へ登録: ' + ok + ' 件' + (fail ? ' / 失敗 ' + fail + ' 件' : ''));
    }
    async function doIgnore() {
        const sel = selectedRows();
        if (!sel.length) { alert('無視する行を選択してください'); return; }
        if (!confirm(sel.length + ' 件を「登録しない(無視)」にします。よろしいですか?')) return;
        const pw = _readCachedMasterPw();
        for (const r of sel) { try { await SupabaseClient.ignoreMeasuredCompound(pw, r.name); } catch (e) { console.warn(e); } }
        await reload();
    }
    async function doUnignore() {
        const sel = selectedRows();
        if (!sel.length) { alert('解除する行を選択してください'); return; }
        const pw = _readCachedMasterPw();
        for (const r of sel) { try { await SupabaseClient.unignoreMeasuredCompound(pw, r.name); } catch (e) { console.warn(e); } }
        await reload();
    }
    card.addEventListener('click', async (ev) => {
        const t = ev.target;
        if (!t || !t.closest) return;
        const vb = t.closest('[data-view]');
        if (vb) { view = vb.getAttribute('data-view'); render(); return; }
        const pv = t.closest('[data-rc-preview]');
        if (pv) {
            const i = parseInt(pv.getAttribute('data-i'), 10);
            const prows = allRows.filter(r => r.status === view);
            // Pass every row so the preview can mark the OTHER still-unprocessed
            // compounds of the same project (it filters to status 'new' itself).
            if (prows[i]) openMeasuredPreview(prows[i], allRows);
            return;
        }
        if (t.matches && t.matches('[data-rc-all]')) {
            const on = t.checked;
            body().querySelectorAll('.rc-sel').forEach(x => { x.checked = on; });
            return;
        }
        if (t.closest('[data-rc-register]')) { await doRegister(); return; }
        if (t.closest('[data-rc-ignore]')) { await doIgnore(); return; }
        if (t.closest('[data-rc-unignore]')) { await doUnignore(); return; }
    });
    await reload();
}

// ===========================================================================
// 測定像プレビュー: embed the viewer (preview/focus mode) in an overlay so a
// master user can judge, from 実測棚卸し, whether a measured compound is a
// usable MRM — signal overlaid on the tissue background, with intensity-range
// and opacity adjust — all via the REAL viewer (ROI-draw & analysis-graph UI
// hidden by the viewer's body.preview class). Reuses each row's projects[]
// (slug + display_name); no extra RPC. Private published projects open through
// the master-pw path (unlock_project_master) since this tab is master-unlocked
// and the same-origin iframe reads the cached master pw from sessionStorage.
// ===========================================================================
// `pendingNames` = the OTHER still-unprocessed compounds measured in this same
// project. The viewer marks them 要評価 so one look at the Method table shows
// everything worth judging in this section, not just the row that was clicked.
function measuredPreviewUrl(slug, compoundName, pendingNames) {
    const pending = (pendingNames && pendingNames.length)
        ? '&pending=' + encodeURIComponent(pendingNames.join('|'))
        : '';
    return 'viewer/index.html#share=' + encodeURIComponent(slug)
        + '&focus=' + encodeURIComponent(compoundName || '')
        + '&preview=1' + pending;
}
// Compounds OTHER than `row` that are still unprocessed and were measured in
// `slug`. Sourced from the rows the stock-take already holds — no extra RPC.
function pendingNamesForProject(slug, siblings, row) {
    const out = [];
    for (const r of (siblings || [])) {
        if (!r || r === row || r.status !== 'new') continue;
        if (r.name_norm && row && r.name_norm === row.name_norm) continue;
        if (!(Array.isArray(r.projects) ? r.projects : []).some(p => p && p.slug === slug)) continue;
        if (r.name) out.push(r.name);
    }
    return out;
}
function openMeasuredPreview(row, siblings) {
    const projects = (Array.isArray(row && row.projects) ? row.projects : []).filter(p => p && p.slug);
    if (!projects.length) { alert('プレビューできる測定プロジェクトが見つかりません'); return; }
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.style.zIndex = '80';   // above the reconcile modal (.modal-backdrop z-index:60)
    // Per-project count of other pending compounds, so the picker shows where
    // the evaluating is worth doing before switching.
    const nPending = (slug) => pendingNamesForProject(slug, siblings, row).length;
    const projLabel = (p) => {
        const n = nPending(p.slug);
        return (p.display_name || p.slug) + (n ? ' — 他に未評価 ' + n + ' 件' : '');
    };
    const optsHtml = projects.map(p =>
        '<option value="' + safe(p.slug) + '">' + safe(projLabel(p)) + '</option>').join('');
    back.innerHTML =
        '<div class="modal-card" style="width:96vw;max-width:1200px;height:92vh;max-height:92vh;display:flex;flex-direction:column;padding:12px 14px;">'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">'
        +   '<h2 style="margin:0;font-size:14px;font-weight:600;">測定像プレビュー: ' + safe(row.name || '') + '</h2>'
        +   (projects.length > 1
                ? '<label style="font-size:11px;color:#475569;">測定PJ <select data-mp-proj style="padding:3px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;background:#fff;">' + optsHtml + '</select></label>'
                : '<span class="muted" style="font-size:11px;">' + safe(projLabel(projects[0])) + '</span>')
        +   '<span data-mp-hint class="muted" style="font-size:11px;"></span>'
        +   '<span style="flex:1"></span>'
        +   '<span class="muted" style="font-size:11px;">重ね合わせ・強度レンジ・透明度はビューア内で調整 (ROI/グラフは非表示)</span>'
        +   '<button type="button" class="btn" data-mp-close>閉じる</button>'
        + '</div>'
        + '<iframe data-mp-frame title="測定像プレビュー" style="flex:1;width:100%;border:1px solid #e5e7eb;border-radius:6px;background:#000;"></iframe>'
        + '</div>';
    document.body.appendChild(back);
    const frame = back.querySelector('[data-mp-frame]');
    const sel = back.querySelector('[data-mp-proj]');
    const hint = back.querySelector('[data-mp-hint]');
    const load = (slug) => {
        const pending = pendingNamesForProject(slug, siblings, row);
        // Re-read on every switch: the pending set is per project.
        if (hint) {
            hint.textContent = pending.length
                ? '（オレンジ = 評価対象 / 薄オレンジ = この測定PJで一緒に評価できる ' + pending.length + ' 件）'
                : '（Method表のオレンジの行が評価対象です）';
        }
        frame.src = measuredPreviewUrl(slug, row.name, pending);
    };
    const close = () => {
        document.removeEventListener('keydown', onKey);
        try { frame.src = 'about:blank'; } catch (e) {}
        back.remove();
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    load(projects[0].slug);
    if (sel) sel.addEventListener('change', () => load(sel.value));
    back.querySelector('[data-mp-close]').addEventListener('click', close);
    back.addEventListener('click', (ev) => { if (ev.target === back) close(); });
    document.addEventListener('keydown', onKey);
}

function bindLibraryEvents() {
    const host = document.getElementById('lib');
    host.addEventListener('click', (ev) => {
        // Quick-select checkbox sits inside <summary>, so a click would also
        // toggle the <details>. Cancel that (which also cancels the native
        // check toggle), then drive selection manually and keep the level-1
        // (summary) and level-2 (detail) checkboxes in sync by shared data-tid.
        const qs = ev.target && ev.target.closest && ev.target.closest('.tr-quick-select');
        if (qs) {
            ev.preventDefault();
            ev.stopPropagation();
            const tid = qs.getAttribute('data-tid');
            const want = !selectedTransitions.has(tid);
            if (want) selectedTransitions.add(tid); else selectedTransitions.delete(tid);
            // preventDefault above cancels the click, which makes the browser
            // restore THIS checkbox to its pre-click (unchecked) state after the
            // handler returns. Re-apply the desired state on the next frame
            // (after that restore, before paint) so the summary checkbox — and
            // the level-2 checkbox if expanded — reflect the selection.
            requestAnimationFrame(() => {
                document.querySelectorAll('#lib .tr-quick-select[data-tid="' + tid + '"], #lib .tr-select[data-tid="' + tid + '"]')
                    .forEach(x => { x.checked = want; });
            });
            updateExportBar();
            renderSelectedPanel();
            return;
        }
        const el = ev.target && ev.target.closest && ev.target.closest('[data-action]');
        if (!el) return;
        const action = el.getAttribute('data-action');
        // Buttons inside <summary> would toggle the <details>; prevent that.
        if (el.closest('summary')) { ev.preventDefault(); }
        ev.stopPropagation();
        const id = el.getAttribute('data-id');
        const tid = el.getAttribute('data-tid');
        switch (action) {
            case 'add-compound': addCompound(); break;
            case 'edit-compound': editCompound(id); break;
            case 'move-shelf': moveCompoundShelf(id); break;
            case 'del-compound': delCompound(id); break;
            case 'add-transition': addTransition(id); break;
            case 'edit-transition': editTransition(tid); break;
            case 'del-transition': delTransition(tid); break;
            case 'add-usage': addUsage(tid); break;
            case 'open-usage': openUsageLink(el.getAttribute('data-slug')); break;
            case 'show-projects': showCompoundProjects(el); break;
        }
    });
    // Transition-selection checkboxes (for .exp export).
    host.addEventListener('change', (ev) => {
        const cb = ev.target;
        if (!cb || !cb.classList || !cb.classList.contains('tr-select')) return;
        const tid = cb.getAttribute('data-tid');
        if (cb.checked) selectedTransitions.add(tid); else selectedTransitions.delete(tid);
        const q = document.querySelector('#lib .tr-quick-select[data-tid="' + tid + '"]');
        if (q) q.checked = cb.checked;   // keep the summary quick-select in sync
        updateExportBar();
        renderSelectedPanel();
    });
}

// Switching shelves resets the filters: each shelf has its own tag / sample-type
// vocabulary, so carrying a chip across would silently show an empty tab.
function bindShelfTabs() {
    const bar = document.getElementById('shelf-tabs');
    if (!bar) return;
    bar.addEventListener('click', (ev) => {
        const el = ev.target && ev.target.closest && ev.target.closest('[data-shelf]');
        if (!el) return;
        const s = el.getAttribute('data-shelf');
        if (s === currentShelf) return;
        currentShelf = s;
        _saveShelf(s);
        filterPolarity = ''; selectedTags.clear(); selectedSampleTypes.clear();
        cancelPendingSearch();   // 保留中の入力が棚切替の後から効かないように
        searchText = '';
        const search = document.getElementById('search');
        if (search) search.value = '';
        renderLibrary();
    });
}

function bindFilterBar() {
    const bar = document.getElementById('filter-bar');
    bar.addEventListener('click', (ev) => {
        const el = ev.target && ev.target.closest && ev.target.closest('[data-filter]');
        if (!el) return;
        const kind = el.getAttribute('data-filter');
        const val = el.getAttribute('data-val');
        if (kind === 'pol') filterPolarity = val;
        else if (kind === 'tag') { if (selectedTags.has(val)) selectedTags.delete(val); else selectedTags.add(val); }
        else if (kind === 'stype') { if (selectedSampleTypes.has(val)) selectedSampleTypes.delete(val); else selectedSampleTypes.add(val); }
        else if (kind === 'clear') { filterPolarity = ''; selectedTags.clear(); selectedSampleTypes.clear(); }
        renderLibrary();
    });
}

async function init() {
    await requireMasterUnlock();
    document.getElementById('btn-back').addEventListener('click', () => { location.href = 'index.html'; });
    document.getElementById('btn-add-compound').addEventListener('click', () => addCompound());
    (() => {
        const fi = document.getElementById('excel-input');
        const btn = document.getElementById('btn-import-excel');
        if (btn) btn.addEventListener('click', () => startBulkImport());
        if (fi) {
            fi.addEventListener('change', async () => {
                const f = fi.files && fi.files[0];
                fi.value = '';   // allow re-selecting the same file later
                if (f) await importMrmFromExcel(f);
            });
        }
    })();
    document.getElementById('btn-reload').addEventListener('click', () => loadLibrary());
    document.getElementById('btn-exp-template').addEventListener('click', () => openTemplateModal());
    document.getElementById('btn-sets').addEventListener('click', () => openSetsModal());
    document.getElementById('btn-reconcile').addEventListener('click', () => openReconcileModal());
    document.getElementById('btn-exp-export').addEventListener('click', () => exportSelectedExp());
    document.getElementById('btn-exp-clear').addEventListener('click', () => clearSelection());
    const search = document.getElementById('search');
    search.addEventListener('input', () => {
        cancelPendingSearch();
        _searchTimer = setTimeout(() => {
            _searchTimer = 0;
            searchText = search.value;
            renderLibrary();
        }, SEARCH_DEBOUNCE_MS);
    });
    currentShelf = _loadShelf();
    bindLibraryEvents();
    bindShelfTabs();
    bindFilterBar();
    bindSelectedPanel();
    updateExportBar();
    renderSelectedPanel();
    await loadLibrary();
}

document.addEventListener('DOMContentLoaded', () => { init().catch(e => { console.error(e); alert('init failed: ' + (e.message || e)); }); });

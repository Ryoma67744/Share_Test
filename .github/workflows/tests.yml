name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: share_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d share_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Publish with concurrent database sessions
        env:
          DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/share_test_ci
        run: node tests/publish_postgres_concurrency.cjs
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24.21.0'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            connector/package-lock.json
            tests/package-lock.json

      - name: Install connector test dependencies
        working-directory: connector
        run: npm ci --no-audit --no-fund

      - name: Install canvas test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      # Includes all non-browser regressions (.js/.cjs/.mjs) and connector parity.
      - name: Run all regressions and connector selftest
        run: node tools/test.cjs
      - name: Install browser for .exp editing workflows
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Existing .exp browser workflows
        run: node tests/exp_editor_browser_regression.mjs
      - name: Project PowerPoint report browser workflow
        run: node tests/project_report_browser_regression.cjs
      - name: PowerPoint output groups and automatic comparison ranges
        run: node tests/project_report_groups_browser_regression.cjs
      - name: Sparse project report browser regression
        run: node tests/project_report_sparse_browser_regression.cjs
      - name: Physical scale bars and calibration updates
        run: node tests/msi_scalebar_browser_regression.cjs
      - name: MSI display presets and compatibility
        run: node tests/msi_display_settings_browser_regression.cjs
      - name: Progressive section loading and persistent TIC backgrounds
        run: node tests/fast_display_browser_regression.cjs
      - name: Visible Preview original demand
        run: node tests/preview_demand_browser_regression.cjs
      - name: Shared metadata-first original loading
        run: node tests/shared_source_demand_browser_regression.cjs
      - name: ROI-only automatic display ranges and restoration
        run: node tests/msi_roi_range_browser_regression.cjs
      - name: Shared section HE alignment and ROI workflows
        run: node tests/msi_spatial_browser_regression.cjs
      - name: Ratio creation, display isolation, ROI statistics and CSV
        run: node tests/msi_ratio_browser_regression.cjs
      - name: Ratio ZIP roundtrip and shared personal settings
        run: node tests/msi_ratio_archive_browser_regression.cjs
      - name: Ratio PowerPoint and microscope comparison outputs
        run: node tests/msi_ratio_outputs_browser_regression.cjs
      - name: Guided Help navigation and packaged screenshots
        run: node tests/help_browser_regression.cjs
      - name: Local persistence and recovery across browser tabs
        run: node tests/project_store_safety_browser_regression.cjs
      - name: Atomic shared-version replacement and preserved local copies
        run: node tests/project_server_replace_browser_regression.cjs
      - name: Fetch latest shared sections into existing projects
        run: node tests/share_refresh_browser_regression.cjs
      - name: New project tabs and isolated authentication
        run: node tests/project_navigation_browser_regression.cjs
      - name: Manager list refresh after returning from another tab
        run: node tests/manager_navigation_browser_regression.cjs
      - name: Preserve in-flight imports and shared-view originals across tabs
        run: node tests/blob_load_lease_browser_regression.cjs
      - name: Archive import ownership and crash recovery
        run: node tests/archive_browser_regression.cjs
      - name: Publish snapshots and local receipts in the real viewer
        run: node tests/publish_browser_regression.cjs
      - name: Build online distribution
        run: node tools/build.cjs --mode web --out dist/web
      - name: Fetch and verify pinned Windows runtime
        if: runner.os == 'Windows'
        run: node tools/fetch-runtime.cjs
      - name: Build offline distribution
        if: runner.os == 'Windows'
        run: node tools/build.cjs --mode offline --out dist/offline --runtime-dir runtime --zip dist/Share_Test_Offline.zip
      - name: Verify packaged Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: dist\offline\START_OFFLINE.bat --verify-only
      - name: Upload tested offline package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Share_Test_Offline-${{ github.sha }}
          path: |
            dist/Share_Test_Offline.zip
            dist/Share_Test_Offline.zip.sha256
          if-no-files-found: error
          retention-days: 14

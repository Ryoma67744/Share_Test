name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24.21.0'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            connector/package-lock.json
            tests/package-lock.json

      - name: Install connector test dependencies
        working-directory: connector
        run: npm ci --no-audit --no-fund

      - name: Install canvas test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      # Includes all non-browser regressions (.js/.cjs/.mjs) and connector parity.
      - name: Run all regressions and connector selftest
        run: node tools/test.cjs
      - name: Install browser for .exp editing workflows
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Existing .exp browser workflows
        run: node tests/exp_editor_browser_regression.mjs
      - name: Project PowerPoint report browser workflow
        run: node tests/project_report_browser_regression.cjs
      - name: Build online distribution
        run: node tools/build.cjs --mode web --out dist/web
      - name: Fetch and verify pinned Windows runtime
        if: runner.os == 'Windows'
        run: node tools/fetch-runtime.cjs
      - name: Build offline distribution
        if: runner.os == 'Windows'
        run: node tools/build.cjs --mode offline --out dist/offline --runtime-dir runtime --zip dist/Share_Test_Offline.zip
      - name: Verify packaged Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: dist\offline\START_OFFLINE.bat --verify-only
      - name: Upload tested offline package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Share_Test_Offline-${{ github.sha }}
          path: |
            dist/Share_Test_Offline.zip
            dist/Share_Test_Offline.zip.sha256
          if-no-files-found: error
          retention-days: 14
